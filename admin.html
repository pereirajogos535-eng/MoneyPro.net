<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MoneyPro Admin - Painel de Controlo</title>
  <link rel="stylesheet" href="admin-styles.css">
</head>
<body>

<div class="admin-container">
  <!-- Cabeçalho -->
  <header class="admin-header">
    <div class="admin-logo">
      <div class="logo-icon">M</div>
      <div class="logo-text">Money<span>Pro</span> Admin</div>
    </div>
    <div class="admin-stats">
      <div class="stat-box">
        <span class="stat-label">Mensagens Novas</span>
        <span class="stat-value" id="totalUnread">0</span>
      </div>
      <div class="stat-box">
        <span class="stat-label">Total Utilizadores</span>
        <span class="stat-value" id="totalUsers">0</span>
      </div>
      <button class="add-user-btn" onclick="openAddUserModal()">+ Novo Utilizador</button>
    </div>
  </header>

  <!-- Navegação de Abas -->
  <div class="admin-tabs">
    <button class="tab-btn active" onclick="switchTab('users')" id="btnTabUsers">👥 Gestão de Utilizadores</button>
    <button class="tab-btn" onclick="switchTab('messages')" id="btnTabMessages">✉️ Caixa de Mensagens <span class="badge" id="msgBadge">0</span></button>
  </div>

  <!-- ABA 1: Gestão de Utilizadores -->
  <main class="admin-main" id="sectionUsers">
    <div class="search-bar">
      <input type="text" id="userSearch" placeholder="Pesquisar por ID, Número, VIP ou Level..." oninput="filterUsers()">
    </div>

    <div class="table-container">
      <table class="user-table">
        <thead>
          <tr>
            <th>ID</th>
            <th>Número</th>
            <th>Senha</th>
            <th>Saldo (AOA)</th>
            <th>Nível / VIP</th>
            <th>Estado</th>
            <th>Ações</th>
          </tr>
        </thead>
        <tbody id="userTableBody">
          <!-- Renderizado pelo JS -->
        </tbody>
      </table>
    </div>
  </main>

  <!-- ABA 2: Caixa de Mensagens -->
  <main class="admin-main" id="sectionMessages" style="display: none;">
    <div class="table-container" style="padding: 20px;">
      <h3 style="margin-bottom: 20px; color: var(--text-primary);">Caixa de Entrada das Contas</h3>
      <div class="message-list" id="messageList">
        <!-- Renderizado pelo JS -->
      </div>
    </div>
  </main>

  <!-- Modal para Editar/Adicionar Utilizador -->
  <div class="modal-overlay" id="userModal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="modalTitle">Editar Utilizador</h3>
        <button class="close-modal" onclick="closeModal('userModal')">&times;</button>
      </div>
      <form id="userForm" onsubmit="saveUser(event)">
        <input type="hidden" id="editUserId">
        <div class="form-grid">
          <div class="form-group">
            <label for="userId">ID da Conta</label>
            <input type="text" id="userId" required>
          </div>
          <div class="form-group">
            <label for="userPhone">Número de Telefone</label>
            <input type="text" id="userPhone" required>
          </div>
        </div>
        <div class="form-group">
          <label for="userPass">Senha</label>
          <input type="text" id="userPass" required>
        </div>
        <div class="form-grid">
          <div class="form-group">
            <label for="userBalance">Saldo (AOA)</label>
            <input type="number" id="userBalance" step="0.01" required>
          </div>
          <div class="form-group">
            <label for="userInvested">Total Investido (AOA)</label>
            <input type="number" id="userInvested" step="0.01" required>
          </div>
        </div>
        <div class="form-grid">
          <div class="form-group">
            <label for="userLevel">Level da Conta</label>
            <input type="number" id="userLevel" min="0" required>
          </div>
          <div class="form-group">
            <label for="userVip">Nível VIP</label>
            <select id="userVip">
              <option value="0">VIP 0</option>
              <option value="1">VIP 1</option>
              <option value="2">VIP 2</option>
              <option value="3">VIP 3</option>
              <option value="4">VIP 4</option>
              <option value="5">VIP 5</option>
              <option value="6">VIP 6</option>
              <option value="7">VIP 7</option>
              <option value="8">VIP 8</option>
            </select>
          </div>
        </div>
        <button type="submit" class="save-btn">Guardar Alterações</button>
      </form>
    </div>
  </div>

  <!-- Modal para Ler Mensagem -->
  <div class="modal-overlay" id="messageModal">
    <div class="modal-content">
      <div class="modal-header">
        <h3>Ler Mensagem</h3>
        <button class="close-modal" onclick="closeModal('messageModal')">&times;</button>
      </div>
      <div class="msg-read-content">
        <p class="msg-meta">De: <strong id="readMsgSender"></strong> | Em: <span id="readMsgDate"></span></p>
        <div class="msg-body" id="readMsgBody"></div>
        <button class="save-btn" style="margin-top:20px; background: var(--border-color);" onclick="closeModal('messageModal')">Fechar Mensagem</button>
      </div>
    </div>
  </div>

  <div class="toast" id="adminToast">Mensagem</div>
</div>

<script src="admin.js"></script>
</body>
</html>
